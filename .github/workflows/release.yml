name: Release

# Builds the desktop app for macOS (universal) and Windows when a version tag
# (v1.2.3) is pushed, attaches the installers to a draft release, and publishes
# it once every build has succeeded, with a SHA256SUMS.txt of the files. Builds are
# not yet signed by Apple or Microsoft (step 9); the release notes and site/help.html
# explain how to open them. Actions are pinned to commits; the tag comments say which.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.4.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # tauri-action uploads the installers to the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/app/src-tauri -> target
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/app
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Wave Exit __VERSION__ (preview)"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            **Preview release.** Wave Exit reads Wave Accounting's export files (and, optionally, a read-only Wave connection), checks the books, and makes an archive, report PDFs, an Excel workbook, a general ledger CSV and bank statement files. Loading straight into QuickBooks Online and Xero is still to come.

            **Which file do I download?**
            - Mac (Apple silicon or Intel): `Wave.Exit_..._universal.dmg`
            - Windows: `Wave.Exit_..._x64_en-US.msi` or `Wave.Exit_..._x64-setup.exe`

            **These builds aren't signed by Apple or Microsoft yet**, so your computer asks before opening them the first time:
            - **Mac:** open the app once and click **Done**, then open **System Settings → Privacy & Security**, scroll down to the message about Wave Exit, and click **Open Anyway**.
            - **Windows:** if SmartScreen says it protected your PC, click **More info**, then **Run anyway**.

            Step-by-step help: https://turbogizzmo.github.io/wave-exit/help.html

            To check a download, compare its SHA-256 with the line for it in `SHA256SUMS.txt` below (Mac: `shasum -a 256 <file>`; Windows: `certutil -hashfile <file> SHA256`).

            Your clients' books stay on your computer: there is no Wave Exit server, no analytics and no upload.

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # add the checksums and publish the draft release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      # Passed through the environment, never pasted into the script.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Not a version tag: $TAG"; exit 1; }
      - name: Add SHA256SUMS.txt
        run: |
          gh release download "$TAG" --repo "$REPO" --dir assets
          cd assets
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber
      - name: Publish the draft release
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest

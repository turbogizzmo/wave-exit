[package]
name = "wave-exit"
version = "0.4.0"
description = "Wave Exit: convert Wave Accounting books for any destination"
edition = "2021"
publish = false
license = "MIT"

[lib]
name = "wave_exit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
